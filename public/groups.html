<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WALAO — groups</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header id="chrome"></header>
    <main>
      <h1>Groups</h1>
      <p id="cap" class="muted">Loading…</p>
      <p id="over-cap" class="notice" hidden></p>
      <p id="error" class="error" hidden></p>

      <section class="card">
        <h2>Before you enable a Group</h2>
        <!-- §28: the Attestation is read and affirmed in the same action that
             enables a Group — the Enable buttons stay inert until it is. -->
        <div class="terms">
          <span class="muted" id="attestation-version"></span>
          <p id="attestation-text">Loading…</p>
          <label class="check">
            <input type="checkbox" id="attestation-ok" />
            <span>I affirm this for every Group I enable.</span>
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Tell the group</h2>
        <!-- §29: telling the other members is the easy path, not homework. -->
        <p class="muted">Paste this into any Group you enable.</p>
        <textarea id="disclosure" rows="5" readonly>Loading…</textarea>
        <button id="copy" class="secondary">Copy</button>
      </section>

      <section class="card">
        <h2>Your Groups</h2>
        <!-- A Session can see hundreds of Groups. Search by name or number, and
             narrow by state, so enabling one is not a scrolling exercise. -->
        <div class="filters">
          <label>Search <input type="text" id="f-q" placeholder="Group name or number" /></label>
          <label
            >Show
            <select id="f-state">
              <option value="">All</option>
              <option value="on">Enabled</option>
              <option value="off">Not enabled</option>
            </select>
          </label>
        </div>
        <p id="count" class="muted"></p>
        <ul class="rows" id="groups">
          <li class="muted">Loading…</li>
        </ul>
      </section>
    </main>

    <script type="module" src="/groups.js"></script>
  </body>
</html>
