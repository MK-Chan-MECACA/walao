<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WALAO — lists</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header id="chrome"></header>
    <main>
      <h1>Lists</h1>
      <p id="error" class="error" hidden></p>

      <section class="card">
        <h2>Reminders</h2>
        <ul class="rows" id="reminders">
          <li class="muted">Loading…</li>
        </ul>
        <details id="closed-box" hidden>
          <summary>Done and dismissed</summary>
          <ul class="rows" id="closed"></ul>
        </details>
      </section>

      <section class="card">
        <h2>Memory candidates</h2>
        <!-- §37: proposed from Summaries, and gone when the Summary ages out. -->
        <p class="muted">Proposed from your Summaries. Confirm one before it lapses to keep it.</p>
        <ul class="rows" id="candidates">
          <li class="muted">Loading…</li>
        </ul>
      </section>

      <section class="card">
        <h2>Memories</h2>
        <p class="muted">What WALAO remembers about your business. Yours to edit or delete.</p>
        <ul class="rows" id="memories">
          <li class="muted">Loading…</li>
        </ul>
      </section>
    </main>

    <script type="module" src="/lists.js"></script>
  </body>
</html>
