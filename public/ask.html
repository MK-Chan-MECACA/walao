<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WALAO — ask</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header id="chrome"></header>
    <main>
      <h1>Ask WALAO</h1>
      <!-- §43: the boundary is stated in the surface most likely to blur it.
           Dynamic scope (enabled Groups) is filled by ask.js; the static
           boundary below it never changes. -->
      <p id="scope" class="muted">Loading…</p>
      <p id="boundary" class="muted">Answers come from Summaries and Memories only — never from raw messages. Summaries older than 90 days are deleted; older decisions survive only as Memories you confirmed.</p>

      <section class="card">
        <form id="ask-form">
          <label for="q">Your question</label>
          <textarea id="q" rows="3" maxlength="1000" required placeholder="Who owes the deposit for the Penang order?"></textarea>
          <button type="submit" id="go">Ask</button>
        </form>
        <!-- The wait is the pipeline: retrieve, rank, answer, check citations.
             Naming the stage the run is in beats an empty page. -->
        <ol id="steps" class="steps" hidden></ol>
        <p id="error" class="error" hidden></p>
      </section>

      <section class="card" id="answer" hidden>
        <h2>Answer</h2>
        <div id="claims"></div>
      </section>
    </main>

    <script type="module" src="/ask.js"></script>
  </body>
</html>
