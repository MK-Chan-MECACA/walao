<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WALAO — connection</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
    <!-- F2: vendored, not CDN — a third-party script runs with this origin, so a
         tampered build could call /v1/* with the session cookie riding along.
         qrcode-generator@1.4.4, jsdelivr build, unmodified.
         sha384-lQXOAyZwHXE55JFyrOMB7nY2Wv+m5ZWNtJcHrd1rceRQXAYNLak8ukN5TjBTcIwz -->
    <script src="/vendor/qrcode.min.js"></script>
  </head>
  <body>
    <header id="chrome"></header>
    <main>
      <h1>Connection</h1>
      <p id="trial" class="muted"></p>

      <section class="card" id="pair-box">
        <h2>Before you pair</h2>
        <!-- §12: the ban-risk wording is served by GET /v1/onboarding and the
             button stays inert until it is affirmed — a decision, not a scroll-past. -->
        <div class="terms">
          <span class="muted" id="disclosure-version"></span>
          <p id="disclosure-text">Loading…</p>
          <label class="check">
            <input type="checkbox" id="disclosure-ok" />
            <span>I have read this and accept the risk.</span>
          </label>
        </div>
        <button id="pair" disabled>Pair WhatsApp</button>
        <p id="error" class="error" hidden></p>
      </section>

      <section class="card" id="code-box" hidden>
        <h2>Scan to pair</h2>
        <div id="qr-code"></div>
        <p class="muted">
          In WhatsApp on your phone: <strong>Settings → Linked devices → Link a device</strong>,
          then scan this QR code. It expires in a few minutes.
        </p>
        <p id="waiting" class="muted">Waiting for WhatsApp to confirm…</p>
      </section>

      <section class="card">
        <h2>Connection history</h2>
        <ul class="rows" id="connections">
          <li class="muted">Loading…</li>
        </ul>
      </section>
    </main>

    <script type="module" src="/pair.js"></script>
  </body>
</html>
