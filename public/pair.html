<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WALAO — connection</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header id="chrome"></header>
    <main>
      <h1>Connection</h1>
      <p id="trial" class="muted"></p>

      <section class="card" id="pair-box">
        <h2>Before you pair</h2>
        <!-- §12: the ban-risk wording is served by GET /v1/onboarding and the
             button stays inert until it is affirmed — a decision, not a scroll-past. -->
        <div class="terms">
          <span class="muted" id="disclosure-version"></span>
          <p id="disclosure-text">Loading…</p>
          <label class="check">
            <input type="checkbox" id="disclosure-ok" />
            <span>I have read this and accept the risk.</span>
          </label>
        </div>
        <button id="pair" disabled>Pair WhatsApp</button>
        <p id="error" class="error" hidden></p>
      </section>

      <section class="card" id="code-box" hidden>
        <h2>Your pairing code</h2>
        <code class="code" id="pairing-code"></code>
        <p class="muted">
          In WhatsApp on your phone: <strong>Settings → Linked devices → Link a device → Link with
          phone number instead</strong>, then enter this code. It expires in a few minutes.
        </p>
        <p id="waiting" class="muted">Waiting for WhatsApp to confirm…</p>
      </section>

      <section class="card">
        <h2>Connection history</h2>
        <ul class="rows" id="connections">
          <li class="muted">Loading…</li>
        </ul>
      </section>
    </main>

    <script type="module">
      import { api, message } from "/api.js";
      import { el, fmtDate, mount } from "/layout.js";

      const $ = (id) => document.getElementById(id);
      const error = $("error");
      let disclosure = null;
      let poll = null;

      mount("/pair");
      loadTrial();
      loadConnections();

      api("GET", "/v1/onboarding")
        .then((d) => {
          disclosure = d;
          $("disclosure-text").textContent = d.text;
          $("disclosure-version").textContent = `version ${d.version}`;
        })
        .catch((err) => {
          $("disclosure-text").textContent = message(err);
        });

      $("disclosure-ok").onchange = (e) => {
        $("pair").disabled = !e.target.checked;
      };

      $("pair").onclick = async () => {
        error.hidden = true;
        $("pair").disabled = true;
        try {
          const res = await api("POST", "/v1/connections", {
            disclosure_version: disclosure?.version,
          });
          $("pairing-code").textContent = res.pairing_code;
          $("code-box").hidden = false;
          $("pair-box").hidden = true;
          // §14: the status arrives without a reload. Cheap poll — the gateway
          // reports connection state on its own webhook, not to this tab.
          poll = setInterval(loadConnections, 3000);
          loadConnections();
        } catch (err) {
          error.textContent = message(err);
          error.hidden = false;
          $("pair").disabled = false;
        }
      };

      async function loadTrial() {
        try {
          const usage = await api("GET", "/v1/usage");
          $("trial").textContent = usage.trial
            ? `Trial: ${usage.trial.days_remaining} day(s) left, ends ${fmtDate(usage.trial.ends_at)}.`
            : `Plan: ${usage.plan}.`;
        } catch {
          /* the status banner already reports a broken session */
        }
      }

      async function loadConnections() {
        let data;
        try {
          data = await api("GET", "/v1/connections");
        } catch (err) {
          $("connections").replaceChildren(el("li", { class: "muted", text: message(err) }));
          return;
        }

        const rows = data.connections.map((c) =>
          el(
            "li",
            {},
            el(
              "span",
              {},
              el("strong", { text: c.status }),
              el("span", {
                class: "muted",
                text: ` since ${fmtDate(c.status_changed_at)} · ${c.external_session_id}`,
              }),
            ),
            c.status === "disconnected"
              ? null
              : el("button", {
                  class: "secondary",
                  text: "Disconnect",
                  onclick: () => disconnect(c.id),
                }),
          ),
        );
        $("connections").replaceChildren(
          ...(rows.length ? rows : [el("li", { class: "muted", text: "No connection yet." })]),
        );

        // Connected: nothing to pair, so the disclosure and the code give way to
        // the history. Disconnecting brings the pairing box back.
        const live = data.connections.some((c) => c.status === "connected");
        $("pair-box").hidden = live || poll !== null; // mid-pairing: the code stands alone
        $("pairing-code").hidden = live;
        if (!live && poll === null) $("pair").disabled = !$("disclosure-ok").checked;
        if (live && poll) {
          clearInterval(poll);
          poll = null;
          $("waiting").textContent = "Connected. WALAO is reading the Groups you enable.";
          mount("/pair");
          loadTrial();
        }
      }

      async function disconnect(id) {
        try {
          await api("POST", `/v1/connections/${id}/disconnect`);
          await loadConnections();
          await mount("/pair");
        } catch (err) {
          error.textContent = message(err);
          error.hidden = false;
        }
      }
    </script>
  </body>
</html>
