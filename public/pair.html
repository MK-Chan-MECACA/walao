<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WALAO — connection</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
    <!-- F2: vendored, not CDN — a third-party script runs with this origin, so a
         tampered build could call /v1/* with the session cookie riding along.
         qrcode-generator@1.4.4, jsdelivr build, unmodified.
         sha384-lQXOAyZwHXE55JFyrOMB7nY2Wv+m5ZWNtJcHrd1rceRQXAYNLak8ukN5TjBTcIwz -->
    <script src="/vendor/qrcode.min.js"></script>
  </head>
  <body>
    <header id="chrome"></header>
    <main>
      <h1>Connection</h1>
      <p id="error" class="error" hidden></p>

      <!-- Dashboard, 2a — live banner: one compact card confirming the link is up,
           shown only while a connected session exists. -->
      <section class="card" id="live-banner" hidden>
        <div class="live-row">
          <span class="dot on"></span>
          <p>Connected. WALAO is reading the Groups you enable.</p>
          <p id="live-since" class="mono muted"></p>
        </div>
      </section>

      <section class="card" id="sessions-card">
        <h3>Sessions</h3>
        <ul class="rows" id="connections">
          <li class="muted">Loading…</li>
        </ul>
      </section>

      <!-- Dashboard, 2a — pairing: disclosure text on the left, QR on the right.
           When a session is live the disclosure collapses behind the connected
           state and the QR is absent; it re-appears for pairing another number. -->
      <section class="card" id="pair-box">
        <h3>Pair another number <span class="muted" style="text-transform:none;letter-spacing:0" id="disclosure-version"></span></h3>
        <div class="pair-grid">
          <div class="pair-left">
            <p id="disclosure-text">Loading…</p>
            <label class="check">
              <input type="checkbox" id="disclosure-ok" />
              <span>I understand and accept the risk.</span>
            </label>
            <button id="pair" disabled>Show pairing code</button>
          </div>
          <div class="pair-right" id="code-box" hidden>
            <div id="qr-code"></div>
            <p id="waiting" class="mono muted">EXPIRES IN 60S</p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/pair.js"></script>
  </body>
</html>
